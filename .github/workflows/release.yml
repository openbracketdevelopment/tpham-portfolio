name: Release build

# Pushing a tag like v1.4.0 (on a master commit) builds and deploys the site.
# Set AUTO_PUBLISH to "false" below to restore draft-only releases.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Temporary auto-publish toggle: "true" = live; "false" = draft + manual publish.
      AUTO_PUBLISH: "true"
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::Tag ${GITHUB_REF_NAME} is not on master. Tag a commit from master."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build and deploy to Netlify
        id: deploy
        run: |
          deploy_args=()
          case "$AUTO_PUBLISH" in
            true) deploy_args+=(--prod) ;;
            false) ;;
            *) echo "::error::AUTO_PUBLISH must be true or false"; exit 1 ;;
          esac
          npx --yes netlify-cli@27 deploy \
            "${deploy_args[@]}" \
            --context production \
            --message "Release ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --json > deploy.json
          echo "deploy_id=$(jq -r .deploy_id deploy.json)" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            if [[ "$AUTO_PUBLISH" == "true" ]]; then
              echo "## Published to production: ${GITHUB_REF_NAME}"
            else
              echo "## Draft deploy ready for ${GITHUB_REF_NAME}"
            fi
            echo ""
            echo "- Preview: ${{ steps.deploy.outputs.deploy_url }}"
            echo "- Deploy ID: \`${{ steps.deploy.outputs.deploy_id }}\`"
            echo ""
            if [[ "$AUTO_PUBLISH" == "true" ]]; then
              echo "This release was automatically published to production."
            else
              echo "To go live, run **Actions → Publish production** with this deploy ID,"
              echo "or click **Publish deploy** on it in the Netlify Deploys list."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
